# Description: Dogfoods wakindex as a pull-request permission policy gate.
name: Agent permission review
on:
  pull_request:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent permissions
        uses: ./
        with:
          path: .
          policy: wakindex-policy.toml
          output: wakindex.sarif
      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: wakindex.sarif
