# Description: Validates version tags and publishes tested GitHub release artifacts.
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: python -m pip install -e ".[dev]" build twine
      - name: Validate tag, versions, and changelog
        run: >-
          python scripts/check_release.py
          --tag "$GITHUB_REF_NAME"
          --notes-output RELEASE_NOTES.md
      - name: Run tests
        run: pytest
      - name: Run lint
        run: ruff check .
      - name: Verify Docker test image
        run: docker build --target test -t wakindex-test .
      - name: Build Python artifacts
        run: python -m build
      - name: Validate Python artifacts
        run: python -m twine check dist/*
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          SHA256SUMS
          --verify-tag
          --notes-file RELEASE_NOTES.md
          --title "wakindex $GITHUB_REF_NAME"
