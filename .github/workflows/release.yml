# Description: Validate SemVer tags, build wakindex, and publish immutable GitHub Releases.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate tag and version
        run: python scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Run regression tests
        run: python -m pytest
      - name: Run static checks
        run: python -m ruff check .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Generate checksums
        run: cd dist && sha256sum *.whl > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "wakindex $GITHUB_REF_NAME"
