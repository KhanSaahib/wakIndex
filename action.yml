# Description: GitHub Docker Action metadata for pull-request permission policy checks.
name: wakIndex permission review
description: Inventory AI agent, MCP, skill, and GitHub token permissions before they run.
author: wakIndex contributors
inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  policy:
    description: wakIndex TOML policy path.
    required: false
    default: wakindex-policy.toml
  output:
    description: SARIF result path.
    required: false
    default: wakindex.sarif
runs:
  using: docker
  image: Dockerfile
branding:
  icon: shield
  color: blue
